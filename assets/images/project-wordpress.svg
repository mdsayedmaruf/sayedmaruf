<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glowGrad)"/>

  <!-- Top Accent Stripe -->
  <rect x="0" y="0" width="800" height="4" fill="#0284c7"/>

  <!-- Main Illustration Content -->
  
        <!-- WordPress Site Browser -->
        <rect x="180" y="80" width="440" height="290" rx="14" fill="#09090b" stroke="#0284c7" stroke-width="1.5"/>
        <rect x="180" y="80" width="440" height="34" rx="14" fill="#18181b"/>
        <circle cx="204" cy="97" r="5" fill="#ef4444"/>
        <circle cx="218" cy="97" r="5" fill="#eab308"/>
        <circle cx="232" cy="97" r="5" fill="#22c55e"/>
        <text x="400" y="101" fill="#71717a" font-size="10" font-family="monospace" text-anchor="middle">WordPress Custom Theme Engine</text>
        
        <circle cx="250" cy="180" r="36" fill="#18181b" stroke="#0284c7" stroke-width="2"/>
        <text x="250" y="186" fill="#38bdf8" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">W</text>
        
        <rect x="310" y="150" width="280" height="18" rx="4" fill="#18181b" stroke="#27272a"/>
        <rect x="310" y="175" width="220" height="12" rx="4" fill="#27272a"/>
        <rect x="310" y="195" width="160" height="12" rx="4" fill="#27272a"/>
        
        <!-- Scorecard -->
        <rect x="204" y="240" width="396" height="65" rx="8" fill="#18181b" stroke="#27272a"/>
        <circle cx="240" cy="272" r="18" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
        <text x="240" y="278" fill="#4ade80" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">98</text>
        <text x="270" y="268" fill="#e4e4e7" font-size="10" font-family="sans-serif" font-weight="bold">Core Web Vitals &amp; PageSpeed</text>
        <text x="270" y="284" fill="#71717a" font-size="8" font-family="monospace">LCP: 0.8s | CLS: 0.00 | FID: 12ms</text>
        

  <!-- Bottom Details Overlay -->
  <rect x="0" y="380" width="800" height="70" fill="#09090b" fill-opacity="0.85"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#27272a" stroke-width="1"/>

  <!-- Category & Badges -->
  <text x="32" y="410" fill="#0284c7" font-size="10" font-family="'Space Mono', monospace" font-weight="bold" letter-spacing="1.5">WORDPRESS · WOOCOMMERCE</text>
  <text x="32" y="432" fill="#f4f4f5" font-size="14" font-family="'PT Sans', sans-serif" font-weight="bold">Custom WordPress Portals & Stores</text>

  <!-- Pill Badge -->
  <rect x="660" y="402" width="108" height="26" rx="6" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1"/>
  <text x="714" y="419" fill="#38bdf8" font-size="9" font-family="'Space Mono', monospace" font-weight="bold" text-anchor="middle" letter-spacing="1">SPEED 95+</text>
</svg>