<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FF6B2B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF6B2B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glowGrad)"/>

  <!-- Top Accent Stripe -->
  <rect x="0" y="0" width="800" height="4" fill="#FF6B2B"/>

  <!-- Main Illustration Content -->
  
        <!-- Mobile Device Outline -->
        <rect x="250" y="70" width="300" height="340" rx="24" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
        <rect x="360" y="80" width="80" height="6" rx="3" fill="#3f3f46"/>
        <rect x="264" y="96" width="272" height="294" rx="14" fill="#09090b"/>
        
        <!-- App Header -->
        <rect x="276" y="110" width="248" height="42" rx="8" fill="#18181b" stroke="#27272a"/>
        <circle cx="296" cy="131" r="10" fill="#FF6B2B" opacity="0.3"/>
        <path d="M296 126 L302 131 L296 136" stroke="#FF6B2B" stroke-width="2" fill="none"/>
        <text x="316" y="135" fill="#f4f4f5" font-size="11" font-family="monospace" font-weight="bold">Govt City College</text>
        
        <!-- App Feature Cards -->
        <rect x="276" y="162" width="118" height="60" rx="8" fill="#18181b" stroke="#FF6B2B" stroke-width="1.2"/>
        <text x="286" y="184" fill="#FF8F5C" font-size="10" font-family="monospace">CLASS ROUTINE</text>
        <text x="286" y="202" fill="#a1a1aa" font-size="8" font-family="sans-serif">Live schedule &amp; rooms</text>
        
        <rect x="406" y="162" width="118" height="60" rx="8" fill="#18181b" stroke="#27272a"/>
        <text x="416" y="184" fill="#4ade80" font-size="10" font-family="monospace">NOTICES</text>
        <text x="416" y="202" fill="#a1a1aa" font-size="8" font-family="sans-serif">Exam circulars &amp; PDF</text>
        
        <rect x="276" y="232" width="248" height="70" rx="8" fill="#18181b" stroke="#27272a"/>
        <text x="288" y="254" fill="#e4e4e7" font-size="11" font-family="sans-serif" font-weight="bold">Study Materials &amp; Faculty</text>
        <text x="288" y="272" fill="#71717a" font-size="9" font-family="sans-serif">Direct access to curriculum slides &amp; teacher profiles</text>
        <rect x="288" y="284" width="70" height="10" rx="5" fill="#22c55e" opacity="0.2"/>
        <text x="296" y="292" fill="#4ade80" font-size="7" font-family="monospace">OFFLINE READY</text>
        
        <!-- Trophy Floating Tag -->
        <rect x="430" y="50" width="130" height="32" rx="16" fill="#FF6B2B"/>
        <text x="495" y="70" fill="#ffffff" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">★ 1st PRIZE WINNER</text>
        

  <!-- Bottom Details Overlay -->
  <rect x="0" y="380" width="800" height="70" fill="#09090b" fill-opacity="0.85"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#27272a" stroke-width="1"/>

  <!-- Category & Badges -->
  <text x="32" y="410" fill="#FF6B2B" font-size="10" font-family="'Space Mono', monospace" font-weight="bold" letter-spacing="1.5">FLUTTER · MOBILE APP</text>
  <text x="32" y="432" fill="#f4f4f5" font-size="14" font-family="'PT Sans', sans-serif" font-weight="bold">Gov't City College Official Mobile App</text>

  <!-- Pill Badge -->
  <rect x="660" y="402" width="108" height="26" rx="6" fill="#FF6B2B" fill-opacity="0.12" stroke="#FF6B2B" stroke-width="1"/>
  <text x="714" y="419" fill="#FF6B2B" font-size="9" font-family="'Space Mono', monospace" font-weight="bold" text-anchor="middle" letter-spacing="1">WON 1ST PRIZE</text>
</svg>