<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glowGrad)"/>

  <!-- Top Accent Stripe -->
  <rect x="0" y="0" width="800" height="4" fill="#0ea5e9"/>

  <!-- Main Illustration Content -->
  
        <!-- Mobile Device Outline -->
        <rect x="250" y="70" width="300" height="340" rx="24" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
        <rect x="360" y="80" width="80" height="6" rx="3" fill="#3f3f46"/>
        <rect x="264" y="96" width="272" height="294" rx="14" fill="#09090b"/>
        
        <!-- App Header -->
        <rect x="276" y="110" width="248" height="42" rx="8" fill="#18181b" stroke="#0ea5e9" stroke-width="1.2"/>
        <text x="290" y="132" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">PROTTOYI 25</text>
        <text x="290" y="144" fill="#a1a1aa" font-size="8" font-family="sans-serif">Batch Special Academic Portal</text>
        
        <!-- Community Features -->
        <rect x="276" y="162" width="248" height="44" rx="8" fill="#18181b" stroke="#27272a"/>
        <circle cx="294" cy="184" r="8" fill="#38bdf8" opacity="0.3"/>
        <text x="312" y="181" fill="#f4f4f5" font-size="10" font-family="sans-serif" font-weight="bold">Class Discussions &amp; Live Polls</text>
        <text x="312" y="195" fill="#71717a" font-size="8" font-family="sans-serif">142 students active in batch thread</text>
        
        <rect x="276" y="214" width="248" height="44" rx="8" fill="#18181b" stroke="#27272a"/>
        <circle cx="294" cy="236" r="8" fill="#4ade80" opacity="0.3"/>
        <text x="312" y="233" fill="#f4f4f5" font-size="10" font-family="sans-serif" font-weight="bold">Chapter Notes &amp; Question Bank</text>
        <text x="312" y="247" fill="#71717a" font-size="8" font-family="sans-serif">28 modules available offline</text>
        
        <rect x="276" y="266" width="248" height="44" rx="8" fill="#18181b" stroke="#27272a"/>
        <circle cx="294" cy="288" r="8" fill="#f59e0b" opacity="0.3"/>
        <text x="312" y="285" fill="#f4f4f5" font-size="10" font-family="sans-serif" font-weight="bold">Batch Memories &amp; Event Gallery</text>
        <text x="312" y="299" fill="#71717a" font-size="8" font-family="sans-serif">Photos, study tours &amp; updates</text>
        

  <!-- Bottom Details Overlay -->
  <rect x="0" y="380" width="800" height="70" fill="#09090b" fill-opacity="0.85"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#27272a" stroke-width="1"/>

  <!-- Category & Badges -->
  <text x="32" y="410" fill="#0ea5e9" font-size="10" font-family="'Space Mono', monospace" font-weight="bold" letter-spacing="1.5">FLUTTER · ACADEMIC LMS</text>
  <text x="32" y="432" fill="#f4f4f5" font-size="14" font-family="'PT Sans', sans-serif" font-weight="bold">Prottoyi 25 — Batch LMS App</text>

  <!-- Pill Badge -->
  <rect x="660" y="402" width="108" height="26" rx="6" fill="#4ADE80" fill-opacity="0.12" stroke="#4ADE80" stroke-width="1"/>
  <text x="714" y="419" fill="#4ADE80" font-size="9" font-family="'Space Mono', monospace" font-weight="bold" text-anchor="middle" letter-spacing="1">ACTIVE PLATFORM</text>
</svg>